        /* Icon Buttons on Cards: Touch target >= 44x44px with chunky styling */

        /* Print CSS: Student pages then Answer Key pages in exact A4 portrait */

<body class="min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==========================================
        // 1. CONFIGURATION & API KEYS
        // ==========================================
        const CONFIG = {
            PIXABAY_KEY: '35727559-0e840d0e0fcf00ac6876a7099',
        };

        // ==========================================
        // 2. LOCALSTORAGE CACHE & SAVED STATE SYSTEM
        // ==========================================
        const CACHE_PREFIX = 'vibeword:v3:';
        const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30 days
        const WORKSHEET_STORAGE_KEY = 'pictorio:worksheets:state:v1';

        const clearVibewordCache = () => {
            try {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && (k.startsWith('vibeword:v1:') || k.startsWith('vibeword:v2:') || k.startsWith('vibeword:v3:'))) {
                        keysToRemove.push(k);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
            } catch (e) {}
        };

        const getCachedResult = (providerKey, sourceFilter, term, page) => {
            try {
                const normalizedTerm = (term || '').trim().toLowerCase();
                const key = `${CACHE_PREFIX}${providerKey}:${sourceFilter}:${normalizedTerm}:${page}`;
                const raw = localStorage.getItem(key);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !parsed.cachedAt) return null;
                if (Date.now() - parsed.cachedAt > CACHE_TTL_MS) {
                    try { localStorage.removeItem(key); } catch (e) {}
                    return null;
                }
                return { ...parsed, fromCache: true };
            } catch (e) {
                return null;
            }
        };

        const setCachedResult = (providerKey, sourceFilter, term, page, result) => {
            if (!result || !result.url) return;
            const normalizedTerm = (term || '').trim().toLowerCase();
            const key = `${CACHE_PREFIX}${providerKey}:${sourceFilter}:${normalizedTerm}:${page}`;
            const payload = JSON.stringify({ ...result, cachedAt: Date.now() });
            try {
                localStorage.setItem(key, payload);
            } catch (err) {
                try {
                    clearVibewordCache();
                    localStorage.setItem(key, payload);
                } catch (retryErr) {}
            }
        };

        // ==========================================
        // 3. RATE LIMITERS & CONCURRENCY CONTROLLERS
        // ==========================================
        class Semaphore {
            constructor(max) {
                this.max = max;
                this.current = 0;
                this.queue = [];
            }
            async acquire() {
                if (this.current < this.max) {
                    this.current++;
                    return;
                }
                await new Promise(resolve => this.queue.push(resolve));
                this.current++;
            }
            release() {
                this.current--;
                if (this.queue.length > 0) {
                    const next = this.queue.shift();
                    next();
                }
            }
            async run(fn) {
                await this.acquire();
                try {
                    return await fn();
                } finally {
                    this.release();
                }
            }
        }

        const cardConcurrency = new Semaphore(3);

        class RateLimiter {
            constructor(minIntervalMs) {
                this.minIntervalMs = minIntervalMs;
                this.lastCallTime = 0;
                this.queue = [];
                this.processing = false;
            }
            async schedule(fn) {
                return new Promise((resolve, reject) => {
                    this.queue.push({ fn, resolve, reject });
                    this.processNext();
                });
            }
            async processNext() {
                if (this.processing || this.queue.length === 0) return;
                this.processing = true;

                const { fn, resolve, reject } = this.queue.shift();
                const now = Date.now();
                const elapsed = now - this.lastCallTime;
                const wait = Math.max(0, this.minIntervalMs - elapsed);

                if (wait > 0) {
                    await new Promise(r => setTimeout(r, wait));
                }

                this.lastCallTime = Date.now();
                try {
                    const res = await fn();
                    resolve(res);
                } catch (err) {
                    reject(err);
                } finally {
                    this.processing = false;
                    if (this.queue.length > 0) {
                        this.processNext();
                    }
                }
            }
        }

        const openverseLimiter = new RateLimiter(1150);
        const wikimediaLimiter = new RateLimiter(250);
        const pixabayLimiter = new RateLimiter(100);
        const arasaacLimiter = new RateLimiter(200);

        const fetchWithTimeout = async (url, options = {}, timeoutMs = 8000) => {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        };

        const reducePhrase = (rawTerm) => {
            if (!rawTerm) return '';
            let text = rawTerm.toLowerCase().trim();
            if (text.startsWith('to ')) {
                text = text.slice(3).trim();
            }
            const initialWords = text.split(/\s+/).filter(Boolean);
            if (initialWords.length >= 3) {
                if (text.startsWith('ir a la ')) text = text.slice(8).trim();
                else if (text.startsWith('ir al ')) text = text.slice(6).trim();
                else if (text.startsWith('ir a ')) text = text.slice(5).trim();
            }
            const stopwords = new Set([
                'the', 'a', 'an', 'my', 'your', 'his', 'her', 'our', 'their', 'some', 'any',
                'i', 'it', 'its', 'you', 'he', 'she', 'we', 'they', 'him', 'them', 'us',
                'of', 'in', 'on', 'at', 'to', 'for', 'with', 'and', 'or',
                'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas',
                'le', 'les', 'une', 'der', 'die', 'das', 'ein', 'eine', 'il', 'lo', 'gli',
                'mi', 'mis', 'tu', 'tus', 'su', 'sus', 'de', 'del', 'en', 'con', 'y', 'o', 'al'
            ]);
            const words = text.split(/\s+/).filter(Boolean);
            const filtered = words.filter(w => !stopwords.has(w));
            if (filtered.length > 0) return filtered.join(' ');
            return rawTerm.trim();
        };

        const NEGATION = /(^|[\s'’])(no|not|never|nunca|jamás|ne|n|pas|jamais|nicht|kein\w*|nie|niemals)(?=$|[\s'’])|n['’]t\b/i;
        const negativeForms = (text, lang) => {
            const t = (text || '').toLowerCase();
            const out = [];
            if (/\b(don['’]?t|do not|doesn['’]?t|does not|didn['’]?t|did not|not)\s+like\b/.test(t)) out.push({ lang: 'en', word: 'dislike' });
            const verb = t.match(/\b(?:don['’]?t|do not|doesn['’]?t|does not|didn['’]?t|did not|never|not)\s+([a-z]+)/);
            if (verb) out.push({ lang: 'en', word: `not ${verb[1]}` });
            if (lang === 'es' && /\bno\s+(me|te|le|nos|os|les)?\s*gustan?\b/.test(t)) out.push({ lang: 'es', word: 'no gustar' });
            if (lang === 'fr' && /n['’]?\s*aim\w*\s+pas|ne\s+pas\s+aimer/.test(t)) out.push({ lang: 'fr', word: 'ne pas aimer' });
            if (lang === 'de' && (/\b(mag|magst|mögen|mögt)\b.*\bnicht\b/.test(t) || /\bnicht\s+mögen\b/.test(t))) out.push({ lang: 'de', word: 'nicht mögen' });
            return out;
        };

        const arasaacCandidates = (term, label, lang) => {
            const L = ['es', 'fr', 'de', 'it'].includes(lang) ? lang : 'es';
            const enNeg = NEGATION.test(term || '');
            const lblNeg = NEGATION.test(label || '');
            const first = [], last = [], extra = [];
            if (label) {
                if (lblNeg) {
                    first.push({ lang: L, word: label.toLowerCase().trim() });
                    extra.push(...negativeForms(label, L));
                } else {
                    const r = reducePhrase(label);
                    if (r) first.push({ lang: L, word: r });
                    const lw = r.split(/\s+/).filter(Boolean).pop();
                    if (lw) last.push({ lang: L, word: lw });
                }
            }
            if (term) {
                if (enNeg) {
                    first.push({ lang: 'en', word: term.toLowerCase().trim().replace(/^to\s+/, '') });
                    extra.push(...negativeForms(term, L));
                } else {
                    const r = reducePhrase(term);
                    if (r) first.push({ lang: 'en', word: r });
                    const lw = r.split(/\s+/).filter(Boolean).pop();
                    if (lw) last.push({ lang: 'en', word: lw });
                }
            }
            const list = [...first, ...extra, ...last];
            if (enNeg || lblNeg) list.push({ lang: 'en', word: 'no' });
            const seen = new Set();
            return list.filter(c => {
                const k = `${c.lang}:${c.word}`;
                if (seen.has(k) || !c.word) return false;
                seen.add(k);
                return true;
            });
        };

        // ==========================================
        // 4. IMAGE PROVIDERS IMPLEMENTATION
        // ==========================================
        const arasaacObj = (id) => ({
            url: `https://api.arasaac.org/api/pictograms/${id}`,
            image: `https://api.arasaac.org/api/pictograms/${id}`,
            provider: 'ARASAAC',
            providerKey: 'arasaac',
            license: 'CC BY-NC-SA',
            author: 'Sergio Palao',
            attribution: 'Pictograms: Sergio Palao. Origin: ARASAAC (https://arasaac.org). Licence: CC BY-NC-SA. Owner: Government of Aragón.',
            sourceUrl: `https://arasaac.org/pictograms/en/${id}`,
            fromCache: true,
        });

        const fetchArasaac = async (term, page, logError, displayLabel, lang = 'es') => {
            const cacheKey = `${term}|${displayLabel || ''}`;
            const cached = getCachedResult('arasaac', 'v3', cacheKey, page);
            if (cached) return cached;

            const candidates = arasaacCandidates(term, displayLabel, lang);
            return arasaacLimiter.schedule(async () => {
                const triedQueries = new Set();
                for (const cand of candidates) {
                    const queryKey = `${cand.lang}:${cand.word.trim().toLowerCase()}`;
                    if (triedQueries.has(queryKey)) continue;
                    triedQueries.add(queryKey);
                    try {
                        const url = `https://api.arasaac.org/api/pictograms/${cand.lang}/bestsearch/${encodeURIComponent(cand.word)}`;
                        const res = await fetchWithTimeout(url);
                        if (!res.ok) continue;
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            const itemIndex = Math.max(0, page - 1);
                            if (itemIndex >= data.length) continue;
                            const item = data[itemIndex];
                            if (item && item._id) {
                                const result = {
                                    url: `https://api.arasaac.org/api/pictograms/${item._id}`,
                                    provider: 'ARASAAC',
                                    providerKey: 'arasaac',
                                    license: 'CC BY-NC-SA',
                                    author: 'Sergio Palao',
                                    attribution: 'Pictograms: Sergio Palao. Origin: ARASAAC (https://arasaac.org). Licence: CC BY-NC-SA. Owner: Government of Aragón.',
                                    sourceUrl: `https://arasaac.org/pictograms/en/${item._id}`,
                                    fromCache: false
                                };
                                logError(`ARASAAC hit for "${displayLabel || term}" with ${cand.lang} query: "${cand.word}"`, "info", "ARASAAC", term);
                                setCachedResult('arasaac', 'v3', cacheKey, page, result);
                                return result;
                            }
                        }
                    } catch (err) {
                        logError(`ARASAAC fetch error for "${cand.word}": ${err.message}`, "error", "ARASAAC", term);
                    }
                }
                return null;
            });
        };

        const fetchPixabayVector = async (term, page, logError) => {
            if (!term) return null;
            const cached = getCachedResult('pixabay_vector', 'any', term, page);
            if (cached) return cached;
            if (!CONFIG.PIXABAY_KEY || CONFIG.PIXABAY_KEY.trim() === '') return null;

            return pixabayLimiter.schedule(async () => {
                try {
                    const url = `https://pixabay.com/api/?key=${encodeURIComponent(CONFIG.PIXABAY_KEY)}&q=${encodeURIComponent(term)}&image_type=vector&per_page=5&page=${page}`;
                    const res = await fetchWithTimeout(url);
                    if (!res.ok) return null;
                    const data = await res.json();
                    if (data.hits && data.hits.length > 0) {
                        const hit = data.hits[0];
                        const result = {
                            url: hit.webformatURL || hit.largeImageURL,
                            provider: 'Pixabay Vector',
                            providerKey: 'pixabay_vector',
                            license: 'Pixabay Licence',
                            author: hit.user || 'Pixabay Creator',
                            attribution: `${hit.user || 'Pixabay Creator'} on Pixabay (Pixabay Licence)`,
                            sourceUrl: hit.pageURL || 'https://pixabay.com',
                            fromCache: false
                        };
                        setCachedResult('pixabay_vector', 'any', term, page, result);
                        return result;
                    }
                } catch (err) {
                    logError(`Pixabay Vector fetch error: ${err.message}`, "error", "Pixabay Vector", term);
                }
                return null;
            });
        };

        const WIKI_REJECT_EXTENSIONS = /\.(tif|tiff|pdf|djvu|ogv|webm|gif|xcf|stl)($|\?)/i;
        const WIKI_BANNED_TITLE_PHRASES = [
            "coat of arms", "flag of", "chart", "graph", "diagram", "signature", "stamp",
            "logo of", "our world in data", "statistics", "data", "trend", "percent",
            "population", "election", "temperature", "anomaly", "syntax", "x-bar"
        ];
        const UNSAFE_TITLE = /hate[\s_-]*(group|symbol|crime)|nazi|swastika|ku[\s_-]*klux|\bkkk\b|white[\s_-]*power|fascis|isis\b|terroris|neo-?nazi|supremac|anti-?sharp|american front/i;
        const YEARISH = /\b(1[6-9]\d\d|20\d\d)\b/;
        const unsuitableTitle = (title, term) => {
            const t = (title || '').toLowerCase().replace(/_/g, ' ');
            const q = (term || '').toLowerCase();
            if (UNSAFE_TITLE.test(t)) return true;
            if (YEARISH.test(t) && !YEARISH.test(q)) return true;
            if (/\bmaps?\b/.test(t) && !/\bmaps?\b/.test(q)) return true;
            return WIKI_BANNED_TITLE_PHRASES.some(phrase => t.includes(phrase.replace(/_/g, ' ')) && !q.includes(phrase.trim()));
        };

        const wikimediaQuery = async (searchQuery, offset, term) => {
            const cleanText = (str) => str ? str.replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim() : '';
            const lowerTerm = (term || '').toLowerCase();
            const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsroffset=${offset}&gsrsearch=${encodeURIComponent(searchQuery)}&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=500`;
            const res = await fetchWithTimeout(url);
            if (!res.ok) return [];
            const data = await res.json();
            if (!data.query || !data.query.pages) return [];
            const out = [];
            for (const p of Object.values(data.query.pages)) {
                if (!p.imageinfo || p.imageinfo.length === 0) continue;
                const info = p.imageinfo[0];
                const meta = info.extmetadata || {};
                const thumb = info.thumburl || info.url;
                if (!thumb) continue;
                if (WIKI_REJECT_EXTENSIONS.test(p.title) || WIKI_REJECT_EXTENSIONS.test(thumb) || (info.url && WIKI_REJECT_EXTENSIONS.test(info.url))) continue;
                const creditLower = cleanText(meta.Artist?.value || meta.Credit?.value).toLowerCase();
                if (unsuitableTitle(p.title, lowerTerm) || creditLower.includes('our world in data')) continue;
                const license = cleanText(meta.LicenseShortName?.value || meta.UsageTerms?.value) || 'CC / Public Domain';
                const author = cleanText(meta.Artist?.value || meta.Credit?.value) || 'Wikimedia Contributor';
                const title = p.title.replace(/^File:/i, '').replace(/\.[^/.]+$/, '');
                out.push({
                    rawTitle: p.title,
                    result: {
                        url: thumb, provider: 'Wikimedia Commons', providerKey: 'wikimedia_commons', license, author,
                        attribution: `"${title}" by ${author} via Wikimedia Commons (${license})`,
                        sourceUrl: info.descriptionurl || `https://commons.wikimedia.org/wiki/${encodeURIComponent(p.title)}`,
                        fromCache: false
                    }
                });
            }
            return out;
        };

        const fetchWikimediaCommons = async (term, page, sourceFilter, logError) => {
            if (!term) return null;
            const cached = getCachedResult('wikimedia_commons', sourceFilter, term, page);
            if (cached) return cached;

            const reducedPhrase = reducePhrase(term);
            const reducedWords = reducedPhrase.split(/\s+/).filter(Boolean);
            const lastWord = reducedWords.length > 0 ? reducedWords[reducedWords.length - 1] : reducedPhrase;

            const ladder = [
                `filetype:svg "${term}"`,
                `filetype:svg ${reducedPhrase}`,
                `filetype:svg ${lastWord} icon`,
                `filetype:drawing ${reducedPhrase}`,
                `${reducedPhrase} clipart`
            ];

            return wikimediaLimiter.schedule(async () => {
                const tryQuery = async (searchQuery) => {
                    const acceptableResults = await wikimediaQuery(searchQuery, (page - 1) * 10, term);
                    if (!acceptableResults || acceptableResults.length === 0) return null;
                    const preferred = acceptableResults.find(item => {
                        const t = item.rawTitle.toLowerCase();
                        return reducedWords.some(w => t.includes(w));
                    });
                    return preferred ? preferred.result : acceptableResults[0].result;
                };

                try {
                    const triedQueries = new Set();
                    for (const query of ladder) {
                        if (triedQueries.has(query)) continue;
                        triedQueries.add(query);
                        const hit = await tryQuery(query);
                        if (hit) {
                            logError(`Wikimedia Commons hit for "${term}"`, "info", "Wikimedia Commons", term);
                            setCachedResult('wikimedia_commons', sourceFilter, term, page, hit);
                            return hit;
                        }
                    }
                } catch (err) {
                    logError(`Wikimedia Commons error: ${err.message}`, "error", "Wikimedia Commons", term);
                }
                return null;
            });
        };

        const fetchOpenverse = async (term, page, sourceFilter, logError) => {
            if (!term) return null;
            const cached = getCachedResult('openverse', sourceFilter, term, page);
            if (cached) return cached;

            return openverseLimiter.schedule(async () => {
                try {
                    const url = `https://api.openverse.org/v1/images/?q=${encodeURIComponent(term)}&page_size=20&page=${page}&extension=svg`;
                    const res = await fetchWithTimeout(url, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) return null;
                    const data = await res.json();
                    const usable = (data.results || []).filter(r => !unsuitableTitle(r.title || r.url, term));
                    if (usable.length > 0) {
                        const item = usable[0];
                        const license = (item.license || 'CC').toUpperCase() + (item.license_version ? ` ${item.license_version}` : '');
                        const author = item.creator || 'Openverse Contributor';
                        const title = item.title || term;
                        const attribution = item.attribution || `"${title}" by ${author} (${license}) via Openverse`;
                        const imageUrl = item.url || item.thumbnail;
                        const result = {
                            url: imageUrl,
                            provider: 'Openverse',
                            providerKey: 'openverse',
                            license,
                            author,
                            attribution,
                            sourceUrl: item.foreign_landing_url || item.url,
                            fromCache: false
                        };
                        setCachedResult('openverse', sourceFilter, term, page, result);
                        return result;
                    }
                } catch (err) {
                    logError(`Openverse fetch error: ${err.message}`, "error", "Openverse", term);
                }
                return null;
            });
        };

            const cands = arasaacCandidates(query, '', L);
            const typed = query.toLowerCase().trim();
            cands.splice(1, 0, { lang: L, word: typed });
            const ids = [];
            for (const c of cands.slice(0, 6)) {
                if (ids.length >= 12) break;
                for (const mode of ['bestsearch', 'search']) {
                    try {
                        const res = await arasaacLimiter.schedule(() => fetchWithTimeout(`https://api.arasaac.org/api/pictograms/${c.lang}/${mode}/${encodeURIComponent(c.word)}`));
                        if (!res.ok) continue;
                        const data = await res.json();
                        if (Array.isArray(data)) data.slice(0, 8).forEach(item => { if (item && item._id && !ids.includes(item._id)) ids.push(item._id); });
                    } catch (e) {}
                    if (ids.length >= 12) break;

            return ids.slice(0, 12).map(arasaacObj);

        const listWikimedia = async (query) => {

                if (!response.ok) return null;
                const blob = await response.blob();
                return await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);

        // ==========================================
        // 6. DECK PAGE RENDERER (Shared by Live Preview & A4 Print)
        // ==========================================
        function DeckPage({ page, cards, pictureMap }) {
            const pct = (v, total) => `${(v / total) * 100}%`;
            const ptToCqw = (pt) => `${(pt / (page.w * 72)) * 100}cqw`;
            const inToCqw = (inch) => `${(inch / page.w) * 100}cqw`;
            const border = (w, dash) => `max(1px, ${ptToCqw(w)}) ${dash ? 'dashed' : 'solid'}`;
            return (
                <div style={{
                    position: 'relative',
                    aspectRatio: `${page.w} / ${page.h}`,
                    background: `#${page.bg || 'FFFFFF'}`,
                    containerType: 'inline-size',
                    overflow: 'hidden',
                    border: '2px solid var(--navy)',
                    borderRadius: 8,
                    boxShadow: '4px 4px 0 var(--navy)',
                    width: '100%',
                }}>
                    {page.els.map((el, i) => {
                        const base = { position: 'absolute', left: pct(el.x, page.w), top: pct(el.y, page.h) };
                        if (el.t === 'text') {
                            return (
                                <div key={i} style={{
                                    ...base,
                                    width: pct(el.w, page.w),
                                    height: pct(el.h, page.h),
                                    display: 'flex',
                                    alignItems: el.valign === 'top' ? 'flex-start' : el.valign === 'bottom' ? 'flex-end' : 'center',
                                    justifyContent: el.align === 'center' ? 'center' : el.align === 'right' ? 'flex-end' : 'flex-start',
                                    textAlign: el.align,
                                    fontSize: ptToCqw(el.pt),
                                    lineHeight: 1.2,
                                    color: `#${el.color}`,
                                    fontFamily: el.mono ? '"Courier New", Courier, monospace' : '"DM Sans", Arial, Helvetica, sans-serif',
                                    fontWeight: el.bold ? 700 : 400,
                                    fontStyle: el.italic ? 'italic' : 'normal',
                                    whiteSpace: 'pre-wrap',
                                    background: el.fill ? `#${el.fill}` : 'transparent'
                                }}>
                                    <span style={{ width: '100%' }}>{el.text}</span>
                                </div>
                            );
                        }
                        if (el.t === 'rect') {
                            return (
                                <div key={i} style={{
                                    ...base,
                                    width: pct(el.w, page.w),
                                    height: pct(el.h, page.h),
                                    boxSizing: 'border-box',
                                    background: el.fill ? `#${el.fill}` : 'transparent',
                                    border: el.line ? border(el.lineW, el.dash).replace(/ (solid|dashed)$/, ` $1 #${el.line}`) : 'none',
                                    borderRadius: el.radius ? inToCqw(el.radius) : 0
                                }} />
                            );
                        }
                        if (el.t === 'line') {
                            return <div key={i} style={{ ...base, width: pct(el.w, page.w), height: 0, borderTop: `${border(el.lineW, el.dash)} #${el.color}` }} />;
                        }
                        if (el.t === 'vline') {
                            return <div key={i} style={{ ...base, width: 0, height: pct(el.h, page.h), borderLeft: `${border(el.lineW, el.dash)} #${el.color}` }} />;
                        }
                        if (el.t === 'img') {
                            const src = el.imageUrl || (cards && cards[el.card] && cards[el.card].image);
                            if (!src) return null;
                            return <img key={i} src={src} alt="" style={{ ...base, width: pct(el.w, page.w), height: pct(el.h, page.h), objectFit: 'contain' }} />;
                        }
                        return null;
                    })}
                </div>
            );

                const raw = localStorage.getItem(WORKSHEET_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') return parsed;
                }
            } catch (e) {}
            return null;
        };

        function PictorioApp() {
            const saved = useMemo(() => getInitialSavedState(), []);

            // Core Inputs & Settings (Saved to localStorage)
            const [lang, setLang] = useState(() => saved?.lang ?? 'es');
            const [customLangName, setCustomLangName] = useState(() => saved?.customLangName ?? '');
            const [boxAText, setBoxAText] = useState(() => saved?.boxAText ?? EXAMPLES.es.vocab);
            const [boxBText, setBoxBText] = useState(() => saved?.boxBText ?? EXAMPLES.es.sentences);
            const [withPictures, setWithPictures] = useState(() => saved?.withPictures !== undefined ? saved.withPictures : true);
            const [seed, setSeed] = useState(() => saved?.seed ?? 1234);

            // Text handling options (Section 4)
            const [removeArticles, setRemoveArticles] = useState(() => saved?.removeArticles !== undefined ? saved.removeArticles : true);
            const [removeAccents, setRemoveAccents] = useState(() => saved?.removeAccents !== undefined ? saved.removeAccents : false);
            const [showTargetRubric, setShowTargetRubric] = useState(() => saved?.showTargetRubric !== undefined ? saved.showTargetRubric : true);

            // Worksheet header & builder state (Section 6)
            const [worksheetTitle, setWorksheetTitle] = useState(() => saved?.worksheetTitle ?? EXAMPLES.es.title);
            const [classLine, setClassLine] = useState(() => saved?.classLine ?? '');
            const [selectedTasks, setSelectedTasks] = useState(() => saved?.selectedTasks ?? ['wordsearch', 'matching', 'sentence_gapfill', 'jumbled_sentences']);
            const [taskSettings, setTaskSettings] = useState(() => ({
                ...window.PictorioDeck.DEFAULT_TASK_SETTINGS,
                ...(saved?.taskSettings || {}),
            }));

            // Persistent picture dictionary keyed by lowercase word/keyword so pictures never change by themselves
            const [pictureMap, setPictureMap] = useState(() => ({
                ...INITIAL_PICTURE_MAP,
                ...(saved?.pictureMap || {}),
            }));

            // Flashcard Grid & Preview Modes
            const [gridConfig, setGridConfig] = useState(() => saved?.gridConfig || GRID_SIZES[1]);
            const [labelMode, setLabelMode] = useState(() => saved?.labelMode || 'full'); // 'full' | 'scaffold' | 'blank'
            const [showEnglishOnCards, setShowEnglishOnCards] = useState(() => !!saved?.showEnglishOnCards);
            const [slideRatio, setSlideRatio] = useState(() => saved?.slideRatio || '16:9');
            const [previewMode, setPreviewMode] = useState('student'); // 'student' | 'answer' | 'both' | 'slides'
            const [showCardsSection, setShowCardsSection] = useState(true);
            const [confirmClear, setConfirmClear] = useState(false);

            // Drag & drop task reordering state
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // Status & Feedback banners
            const [loadingImages, setLoadingImages] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            const [warningMessage, setWarningMessage] = useState('');
            const [successMessage, setSuccessMessage] = useState('');

            // Picture Picker modal: { wordKey, displayWord, searchTerm, loading, groups }
            const [picker, setPicker] = useState(null);

            // Activity log & attributions accordion
            const [logs, setLogs] = useState([]);
            const [showLogDrawer, setShowLogDrawer] = useState(false);
            const [showAttributionsPanel, setShowAttributionsPanel] = useState(false);
            const [copiedAttributions, setCopiedAttributions] = useState(false);
            const [exportingFormat, setExportingFormat] = useState(null); // 'worksheet' | 'slides' | null

            const logUiError = (message, type = 'warning', provider = 'General', term = '') => {
                const newEntry = {
                    id: Date.now() + Math.random(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    message,
                    type,
                    provider,
                    term
                };
                setLogs(prev => [newEntry, ...prev.slice(0, 24)]);
            };

            // Persist all inputs, settings, seed, and chosen pictures to localStorage (Section 9)
            useEffect(() => {
                try {
                    const payload = {
                        lang,
                        customLangName,
                        boxAText,
                        boxBText,
                        withPictures,
                        seed,
                        removeArticles,
                        removeAccents,
                        showTargetRubric,
                        worksheetTitle,
                        classLine,
                        selectedTasks,
                        taskSettings,
                        pictureMap,
                        gridConfig,
                        labelMode,
                        showEnglishOnCards,
                        slideRatio,
                    };
                    localStorage.setItem(WORKSHEET_STORAGE_KEY, JSON.stringify(payload));
                } catch (e) {}
            }, [
                lang, customLangName, boxAText, boxBText, withPictures, seed,
                removeArticles, removeAccents, showTargetRubric, worksheetTitle,
                classLine, selectedTasks, taskSettings, pictureMap, gridConfig,
                labelMode, showEnglishOnCards, slideRatio
            ]);

            // Parse Box A & Box B deterministically
            const parsedBoxA = useMemo(() => window.PictorioDeck.parseVocabulary(boxAText), [boxAText]);
            const parsedBoxB = useMemo(() => window.PictorioDeck.parseSentences(boxBText), [boxBText]);

            // Automatic Picture Resolver when `withPictures` is ON:
            // Only looks up words or *keywords* that don't yet have a stored entry in `pictureMap`.
            // When `withPictures` is OFF, NO picture search runs at all (Acceptance Check #7).
            const pendingLookupsRef = useRef(new Set());
            useEffect(() => {
                if (!withPictures) return;

                const toLookup = [];
                parsedBoxA.items.forEach(item => {
                    const key = item.target.toLowerCase().trim();
                    if (key && !pictureMap[key] && !pendingLookupsRef.current.has(key)) {
                        toLookup.push({ key, target: item.target, english: item.english });
                    }
                });
                parsedBoxB.items.forEach(sent => {
                    if (sent.pictureKeyword) {
                        const key = sent.pictureKeyword.toLowerCase().trim();
                        const stripped = window.PictorioDeck.stripArticle(key);
                        if (key && !pictureMap[key] && !pictureMap[stripped] && !pendingLookupsRef.current.has(key)) {
                            toLookup.push({ key, target: sent.pictureKeyword, english: sent.english });
                        }
                    }
                });

                if (toLookup.length === 0) return;

                let cancelled = false;
                const timer = setTimeout(async () => {
                    setLoadingImages(true);
                    const foundUpdates = {};
                    await Promise.all(toLookup.map(entry => cardConcurrency.run(async () => {
                        pendingLookupsRef.current.add(entry.key);
                        try {
                            const res = await resolveImageFallback(entry.english || entry.target, 1, logUiError, entry.target, lang);
                            if (res && res.url) {
                                foundUpdates[entry.key] = {
                                    ...res,
                                    image: res.url,
                                    searchTerm: entry.english || entry.target,
                                    imagePage: 1,
                                };
                            }
                        } finally {
                            pendingLookupsRef.current.delete(entry.key);
                        }
                    })));
                    if (!cancelled && Object.keys(foundUpdates).length > 0) {
                        setPictureMap(prev => ({ ...prev, ...foundUpdates }));
                    }
                    if (!cancelled) setLoadingImages(false);
                }, 320);

                return () => {
                    cancelled = true;
                    clearTimeout(timer);
                };
            }, [withPictures, parsedBoxA.items, parsedBoxB.items, lang, pictureMap]);

            // Build the cards array for the Flashcard Grid & Deck Engine
            const cards = useMemo(() => {
                return parsedBoxA.items.map((item, idx) => {
                    const key = item.target.toLowerCase().trim();
                    const strippedKey = window.PictorioDeck.stripArticle(key);
                    const pic = withPictures ? (pictureMap[key] || pictureMap[strippedKey] || null) : null;
                    return {
                        index: idx,
                        wordKey: key,
                        word: item.target,
                        target: item.target,
                        searchTerm: item.english || item.target,
                        english: item.english,
                        image: pic ? (pic.image || pic.url) : null,
                        provider: pic ? (pic.provider || 'None') : 'None',
                        providerKey: pic ? (pic.providerKey || '') : '',
                        license: pic ? (pic.license || '') : '',
                        author: pic ? (pic.author || '') : '',
                        attribution: pic ? (pic.attribution || '') : '',
                        sourceUrl: pic ? (pic.sourceUrl || '') : '',
                        imagePage: pic ? (pic.imagePage || 1) : 1,
                        fromCache: !!(pic && pic.fromCache),
                        history: pic?.history || [],
                    };
                });
            }, [parsedBoxA.items, pictureMap, withPictures]);

            // Extra sentence *keyword* cards not already in Box A
            const extraKeywordCards = useMemo(() => {
                if (!withPictures) return [];
                const boxAKeys = new Set(parsedBoxA.items.flatMap(it => {
                    const k = it.target.toLowerCase().trim();
                    return [k, window.PictorioDeck.stripArticle(k)];
                }));
                const extras = [];
                const seen = new Set();
                parsedBoxB.items.forEach(s => {
                    if (!s.pictureKeyword) return;
                    const k = s.pictureKeyword.toLowerCase().trim();
                    const stripped = window.PictorioDeck.stripArticle(k);
                    if (boxAKeys.has(k) || boxAKeys.has(stripped) || seen.has(k)) return;
                    seen.add(k);
                    const pic = pictureMap[k] || pictureMap[stripped] || null;
                    extras.push({
                        wordKey: k,
                        word: s.pictureKeyword,
                        searchTerm: s.english || s.pictureKeyword,
                        image: pic ? (pic.image || pic.url) : null,
                        provider: pic ? (pic.provider || 'None') : 'None',
                        license: pic ? (pic.license || '') : '',
                        author: pic ? (pic.author || '') : '',
                        attribution: pic ? (pic.attribution || '') : '',
                        imagePage: pic ? (pic.imagePage || 1) : 1,
                        history: pic?.history || [],
                    });
                });
                return extras;
            }, [withPictures, parsedBoxA.items, parsedBoxB.items, pictureMap]);

            // Build live deterministic Worksheet Deck and Slides Deck
            const worksheetDeck = useMemo(() => {
                return window.PictorioDeck.buildWorksheetDeck({
                    format: 'worksheet',
                    slideRatio,
                    lang,
                    customLangName,
                    title: worksheetTitle,
                    classLine,
                    seed,
                    withPictures,
                    vocab: parsedBoxA.items,
                    sentences: parsedBoxB.items,
                    cards,
                    pictureMap,
                    removeArticles,
                    removeAccents,
                    showTargetRubric,
                    selectedTasks,
                    taskSettings,
                });
            }, [
                slideRatio, lang, customLangName, worksheetTitle, classLine, seed,
                withPictures, parsedBoxA.items, parsedBoxB.items, cards, pictureMap,
                removeArticles, removeAccents, showTargetRubric, selectedTasks, taskSettings
            ]);

            const slidesDeck = useMemo(() => {
                return window.PictorioDeck.buildWorksheetDeck({
                    format: 'slides',
                    slideRatio,
                    lang,
                    customLangName,
                    title: worksheetTitle,
                    classLine,
                    seed,
                    withPictures,
                    vocab: parsedBoxA.items,
                    sentences: parsedBoxB.items,
                    cards,
                    pictureMap,
                    removeArticles,
                    removeAccents,
                    showTargetRubric,
                    selectedTasks,
                    taskSettings,
                });
            }, [
                slideRatio, lang, customLangName, worksheetTitle, classLine, seed,
                withPictures, parsedBoxA.items, parsedBoxB.items, cards, pictureMap,
                removeArticles, removeAccents, showTargetRubric, selectedTasks, taskSettings
            ]);

            // Picture manipulation helpers (stored by wordKey in pictureMap)
            const applyPictureToKey = (wordKey, imgData, extra = {}) => {
                const k = (wordKey || '').toLowerCase().trim();
                if (!k) return;
                setPictureMap(prev => {
                    const existing = prev[k] || {};
                    const history = existing.image
                        ? [...(existing.history || []), {
                            image: existing.image,
                            url: existing.url,
                            provider: existing.provider,
                            providerKey: existing.providerKey,
                            license: existing.license,
                            author: existing.author,
                            attribution: existing.attribution,
                            sourceUrl: existing.sourceUrl,
                            imagePage: existing.imagePage,
                            searchTerm: existing.searchTerm,
                        }].slice(-15)
                        : (existing.history || []);
                    return {
                        ...prev,
                        [k]: {
                            ...imgData,
                            image: imgData.url || imgData.image,
                            url: imgData.url || imgData.image,
                            history,
                            ...extra,
                        }
                    };
                });
            };

            const undoPictureForKey = (wordKey) => {
                const k = (wordKey || '').toLowerCase().trim();
                setPictureMap(prev => {
                    const existing = prev[k];
                    if (!existing || !existing.history || existing.history.length === 0) return prev;
                    const last = existing.history[existing.history.length - 1];
                    const nextHistory = existing.history.slice(0, -1);
                    return {
                        ...prev,
                        [k]: {
                            ...last,
                            history: nextHistory,
                        }
                    };
                });
            };

            const handleRefreshCardImage = async (card) => {
                if (!withPictures) return;
                const nextPage = (card.imagePage || 1) + 1;
                const imgData = await resolveImageFallback(card.searchTerm, nextPage, logUiError, card.word, lang);
                if (imgData && imgData.url) {
                    applyPictureToKey(card.wordKey, imgData, { imagePage: nextPage, searchTerm: card.searchTerm });
                } else {
                    logUiError(`No alternative image found for "${card.word}" on page ${nextPage}.`, "info", "Refresh", card.word);
                }
            };

            const handleUploadCardImage = (wordKey, event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (reader.result) {
                        applyPictureToKey(wordKey, {
                            url: reader.result,
                            image: reader.result,
                            provider: 'Upload',
                            providerKey: 'upload',
                            license: 'User Provided',
                            author: 'Teacher upload',
                            attribution: `Uploaded image (${file.name})`,
                            sourceUrl: '',
                            fromCache: false,
                        });
                    }
                };
                reader.readAsDataURL(file);
            };

            const runPickerSearch = async (wordKey, displayWord, query) => {
                const q = (query || '').trim();
                if (!q) return;
                setPicker({ wordKey, displayWord, query: q, loading: true, groups: [] });
                const [arasaac, pixV, wiki, openv, pixI] = await Promise.all([
                    listArasaac(q, lang),
                    listPixabay(q, 'vector'),
                    listWikimedia(q),
                    listOpenverse(q),
                    listPixabay(q, 'illustration'),
                ]);
                const groups = [
                    { name: 'ARASAAC pictograms', note: 'CC BY-NC-SA: free classroom use only', items: arasaac },
                    { name: 'Pixabay drawings', note: 'Pixabay Licence', items: [...pixV, ...pixI] },
                    { name: 'Wikimedia Commons', note: 'Licence varies: check the credit', items: wiki },
                    { name: 'Openverse', note: 'Licence varies: check the credit', items: openv },
                ];
                setPicker(p => (p && p.wordKey === wordKey && p.query === q ? { ...p, loading: false, groups } : p));
            };

            useEffect(() => {
                if (!picker) return;
                const onKey = (e) => { if (e.key === 'Escape') setPicker(null); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [picker]);

            // Task list actions: tick/untick, reorder, per-task setting update, Quick Worksheet
            const toggleTask = (taskId) => {
                setSelectedTasks(prev => {
                    if (prev.includes(taskId)) return prev.filter(id => id !== taskId);
                    return [...prev, taskId];
                });
            };

            const moveTask = (index, direction) => {
                setSelectedTasks(prev => {
                    const targetIndex = index + direction;
                    if (targetIndex < 0 || targetIndex >= prev.length) return prev;
                    const copy = prev.slice();
                    const [item] = copy.splice(index, 1);
                    copy.splice(targetIndex, 0, item);
                    return copy;
                });
            };

            const handleDropTask = (targetTaskId) => {
                if (!draggedTaskId || draggedTaskId === targetTaskId) return;
                setSelectedTasks(prev => {
                    const fromIdx = prev.indexOf(draggedTaskId);
                    const toIdx = prev.indexOf(targetTaskId);
                    if (fromIdx < 0 || toIdx < 0) return prev;
                    const copy = prev.slice();
                    copy.splice(fromIdx, 1);
                    copy.splice(toIdx, 0, draggedTaskId);
                    return copy;
                });
                setDraggedTaskId(null);
            };

            const updateTaskSetting = (taskId, key, val) => {
                setTaskSettings(prev => ({
                    ...prev,
                    [taskId]: {
                        ...(prev[taskId] || {}),
                        [key]: val,
                    }
                }));
            };

            // Section 6: "One click on 'Quick worksheet' adds a sensible default set:
            // word search + matching + gap fill + jumbled sentences (skipping any that can't run)."
            const handleQuickWorksheet = () => {
                const defaultSet = ['wordsearch', 'matching', 'sentence_gapfill', 'jumbled_sentences'];
                const runnable = defaultSet.filter(tId => {
                    const avail = window.PictorioDeck.getTaskAvailability(tId, {
                        vocab: parsedBoxA.items,
                        sentences: parsedBoxB.items,
                        withPictures,
                    });
                    return avail.available;
                });
                setSelectedTasks(runnable);
                setSuccessMessage('Quick worksheet ready: ' + (runnable.length ? `${runnable.length} tasks added.` : 'Add vocabulary or sentences first.'));
                setTimeout(() => setSuccessMessage(''), 2500);
            };

            // Load a language example
            const handleLoadExample = (langCode) => {
                const ex = EXAMPLES[langCode] || EXAMPLES.es;
                setLang(langCode);
                setWorksheetTitle(ex.title);
                setBoxAText(ex.vocab);
                setBoxBText(ex.sentences);
                setPictureMap(prev => ({ ...INITIAL_PICTURE_MAP, ...prev }));
            };

            // Clear all with confirm step (Section 9)
            const handleConfirmClearAll = () => {
                try {
                    localStorage.removeItem(WORKSHEET_STORAGE_KEY);
                } catch (e) {}
                setLang('es');
                setCustomLangName('');
                setWorksheetTitle(EXAMPLES.es.title);
                setClassLine('');
                setBoxAText(EXAMPLES.es.vocab);
                setBoxBText(EXAMPLES.es.sentences);
                setWithPictures(true);
                setRemoveArticles(true);
                setRemoveAccents(false);
                setShowTargetRubric(true);
                setSeed(1234);
                setSelectedTasks(['wordsearch', 'matching', 'sentence_gapfill', 'jumbled_sentences']);
                setTaskSettings(window.PictorioDeck.DEFAULT_TASK_SETTINGS);
                setPictureMap(INITIAL_PICTURE_MAP);
                setConfirmClear(false);
                setSuccessMessage('Reset to default Spanish example.');
                setTimeout(() => setSuccessMessage(''), 2500);
            };

            // PowerPoint Export (Worksheet A4 or Slides 16:9 / 4:3)
            const prepareImageForPptx = (dataUrl) => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const w = img.naturalWidth, h = img.naturalHeight;
                    const scale = Math.max(w, h) > 900 ? 800 / Math.max(w, h) : 1;
                    if (scale >= 1 || /^data:image\/svg/.test(dataUrl)) return resolve({ data: dataUrl, w, h });
                    try {
                        const c = document.createElement('canvas');
                        c.width = Math.round(w * scale);
                        c.height = Math.round(h * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        const jpeg = /^data:image\/jpe?g/.test(dataUrl);
                        resolve({ data: c.toDataURL(jpeg ? 'image/jpeg' : 'image/png', 0.88), w: c.width, h: c.height });
                    } catch (e) {
                        resolve({ data: dataUrl, w, h });
                    }
                };
                img.onerror = () => resolve({ data: dataUrl, w: 0, h: 0 });
                img.src = dataUrl;
            });

            const handleExportPptx = async (format) => {
                if (!window.PptxGenJS || !window.PictorioDeck) return;
                setErrorMessage('');
                setWarningMessage('');
                setSuccessMessage('');
                setExportingFormat(format);
                try {
                    const targetDeck = format === 'slides' ? slidesDeck : worksheetDeck;
                    const urlsToFetch = new Set();
                    targetDeck.pages.forEach(p => {
                        p.els.forEach(el => {
                            if (el.t === 'img') {
                                const u = el.imageUrl || (cards[el.card] && cards[el.card].image);
                                if (u) urlsToFetch.add(u);
                            }
                        });
                    });

                    const imagesLookup = {};
                    await Promise.all(Array.from(urlsToFetch).map(async (url) => {
                        const b64 = await fetchImageAsBase64(url);
                        if (b64) {
                            imagesLookup[url] = await prepareImageForPptx(b64);
                        }
                    }));
                    cards.forEach((c, i) => {
                        if (c.image && imagesLookup[c.image]) {
                            imagesLookup[i] = imagesLookup[c.image];
                        }
                    });

                    const layout = format === 'slides'
                        ? (slideRatio === '4:3' ? 'PICTORIO_4x3' : 'PICTORIO_16x9')
                        : 'A4_PORTRAIT';
                    const pptx = window.PictorioDeck.toPptx(targetDeck, imagesLookup, window.PptxGenJS, layout);
                    const safeTitle = (worksheetTitle || 'Pictorio_Worksheet')
                        .replace(/[^\p{L}\p{N} _-]+/gu, '')
                        .trim()
                        .replace(/\s+/g, '_') || 'Pictorio_Worksheet';
                    await pptx.writeFile({ fileName: `${safeTitle}_v${seed}_${format === 'slides' ? 'Slides' : 'Worksheet'}.pptx` });
                    setSuccessMessage(`${format === 'slides' ? 'PowerPoint Slides' : 'PowerPoint Worksheet'} downloaded (Version #${seed})`);
                    setTimeout(() => setSuccessMessage(''), 3500);
                } catch (err) {
                    setErrorMessage(`PowerPoint export error: ${err.message}`);
                } finally {
                    setExportingFormat(null);
                }
            };

            const handlePrintWorksheet = () => {
                window.print();
            };

            const cardsWithAttribution = cards.filter(c => c.image && (c.attribution || c.license));

            const handleCopyAttributions = async () => {
                if (cardsWithAttribution.length === 0) return;
                const textLines = cardsWithAttribution.map(c => `${c.word} — ${c.attribution || c.license || c.provider}`);
                try {
                    await navigator.clipboard.writeText(textLines.join('\n'));
                    setCopiedAttributions(true);
                    setTimeout(() => setCopiedAttributions(false), 2000);
                } catch (err) {
                    setErrorMessage(`Failed to copy attributions: ${err.message}`);
                }
            };

            // Pages shown in the live preview panel
            const previewPages = useMemo(() => {
                if (previewMode === 'slides') return slidesDeck.pages;
                if (previewMode === 'answer') return worksheetDeck.answerPages;
                if (previewMode === 'both') return [...worksheetDeck.studentPages, ...worksheetDeck.answerPages];
                return worksheetDeck.studentPages;
            }, [previewMode, worksheetDeck, slidesDeck]);

            // Missing translations warnings (Section 1: "No auto-translation. The teacher always gives both languages. If a translation is missing, show a warning. Never guess.")
            const missingTranslationWarnings = useMemo(() => {
                const msgs = [];
                if (parsedBoxA.missingEnglishCount > 0) {
                    const missingWords = parsedBoxA.items.filter(i => i.missingEnglish).map(i => `"${i.target}"`).slice(0, 5).join(', ');
                    msgs.push(`Box A has ${parsedBoxA.missingEnglishCount} ${parsedBoxA.missingEnglishCount === 1 ? 'word' : 'words'} without an English translation (${missingWords}). No auto-translation is used.`);
                }
                if (parsedBoxB.missingEnglishCount > 0) {
                    msgs.push(`Box B has ${parsedBoxB.missingEnglishCount} ${parsedBoxB.missingEnglishCount === 1 ? 'sentence' : 'sentences'} without an English translation. No auto-translation is used.`);
                }
                return msgs;
            }, [parsedBoxA, parsedBoxB]);

            return (
                <div className="flex flex-col items-center min-h-screen pb-20 bg-[var(--cream)]">

                    {/* =========================================================
                        PRINT-ONLY A4 VIEW: Student Pages then Answer Key Pages
                       ========================================================= */}
                    <div className="print-only-root">
                        {[...worksheetDeck.studentPages, ...worksheetDeck.answerPages].map((page, idx) => (
                            <div key={idx} className="a4-print-page">
                                <DeckPage page={page} cards={cards} pictureMap={pictureMap} />
                            </div>
                        ))}
                    </div>

                    {/* =========================================================
                        HEADER BAR (Screen Only)
                       ========================================================= */}
                    <header className="w-full bg-[var(--cream)] pt-7 pb-5 no-print">
                        <div className="app-container flex flex-col lg:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3 flex-wrap justify-center lg:justify-start">
                                <div className="relative inline-block">
                                    <h1 className="heading-1 text-[var(--navy)] tracking-tight">
                                        Pictorio Worksheets
                                    </h1>
                                    <div className="h-[7px] bg-[var(--orange)] border-[1.5px] border-[var(--navy)] rounded-full mt-1 w-[86%]"></div>
                                </div>
                                <span
                                    className="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full border-[2.5px] border-[var(--navy)] bg-[var(--mustard)] text-[var(--navy)] shadow-[3px_3px_0_var(--navy)] select-none"
                                    style={{ transform: 'rotate(-5deg)' }}
                                >
                                    Deterministic
                                </span>
                            </div>

                            {/* Top Global Controls: With/Without Pictures + Seed Version # + Clear All */}
                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                {/* Pictures On / Off Toggle (Section 3) */}

                                        🖼️ With pictures
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setWithPictures(false)}
                                        className={`px-3 py-1.5 rounded-[7px] text-xs font-bold transition-colors cursor-pointer ${!withPictures ? 'bg-[var(--mustard)] text-[var(--navy)] border-[1.5px] border-[var(--navy)]' : 'text-[var(--navy)] opacity-75 hover:opacity-100'}`}
                                    >
                                        🔤 Without pictures
                                    </button>
                                </div>

                                {/* Seed Control: "Version #1234" + "New version" button (Section 1) */}
                                <div className="inline-flex items-center gap-2 bg-[var(--paper)] border-[2.5px] border-[var(--navy)] rounded-[10px] px-3 py-1.5 shadow-[3px_3px_0_var(--navy)]">

                                    </label>

                                        id="seed-input"

                                        min="1"
                                        max="999999"

                                            setSeed(Number.isFinite(v) && v > 0 ? v : 1);

                                    </button>
                                ) : (
                                    <div className="inline-flex items-center gap-1.5 bg-[var(--mustard)] border-[2.5px] border-[var(--navy)] rounded-[10px] px-2.5 py-1 shadow-[3px_3px_0_var(--navy)]">

                                        <button
                                            type="button"
                                            onClick={handleConfirmClearAll}

                                        >
                                            Yes, reset
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setConfirmClear(false)}
                                            className="px-2 py-1 text-xs font-bold bg-[var(--paper)] text-[var(--navy)] border-[1.5px] border-[var(--navy)] rounded cursor-pointer"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="app-container no-print space-y-6">

                        {/* --- STATUS & WARNING BANNERS --- */}
                        {successMessage && (
                            <div className="msg-box msg-success justify-between">
                                <div className="flex items-center gap-2">
                                    <span className="font-bold">✓ {successMessage}</span>
                                </div>
                                <button onClick={() => setSuccessMessage('')} className="font-bold px-2 py-0.5 cursor-pointer text-[var(--cream)]">✕</button>
                            </div>
                        )}

                        {errorMessage && (
                            <div className="msg-box msg-error justify-between">
                                <div className="flex items-center gap-2">
                                    <span className="font-bold">✕ {errorMessage}</span>
                                </div>
                                <button onClick={() => setErrorMessage('')} className="font-bold px-2 py-0.5 cursor-pointer text-[var(--cream)]">✕</button>
                            </div>

                                        <span>⚠️</span>
                                        <span>{w}</span>
                                    </div>
                                ))}
                                {worksheetDeck.warnings.map((w, i) => (
                                    <div key={`pw-${i}`} className="flex items-center gap-2 font-bold text-xs">
                                        <span>⚠️</span>
                                        <span>{w}</span>
                                    </div>
                                ))}
                            </div>

                            SECTION 2: INPUTS PANEL (Target Language + Box A + Box B + Text Rules)
                           ========================================================= */}
                        <section className="kind-panel p-5">
                            {/* Top Row: Target Language Selector & Preloaded Language Examples */}
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 mb-4 border-b-[2px] border-[var(--navy)]">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <label htmlFor="target-lang-select" className="text-sm font-bold text-[var(--navy)]">
                                        Target language:
                                    </label>
                                    <select
                                        id="target-lang-select"
                                        value={lang}
                                        onChange={(e) => setLang(e.target.value)}
                                        className="select-chunky text-sm"
                                    >
                                        <option value="es">Spanish</option>
                                        <option value="fr">French</option>
                                        <option value="de">German</option>
                                        <option value="it">Italian</option>
                                        <option value="other">Other</option>
                                    </select>
                                    {lang === 'other' && (
                                        <input
                                            type="text"
                                            value={customLangName}
                                            onChange={(e) => setCustomLangName(e.target.value)}
                                            placeholder="Language name (e.g. Portuguese)"
                                            className="textarea-chunky px-3 py-1.5 text-sm font-bold w-56"
                                            aria-label="Custom target language name"
                                        />
                                    )}
                                    <span className="text-xs font-bold text-[var(--navy)] opacity-70">
                                        Support language: English
                                    </span>
                                </div>

                                <div className="flex items-center gap-2 flex-wrap">

                                        <button
                                            key={code}
                                            type="button"
                                            onClick={() => handleLoadExample(code)}
                                            className={`grid-pill ${lang === code && boxAText === EXAMPLES[code].vocab ? 'grid-pill-selected' : 'grid-pill-unselected'}`}
                                        >
                                            {name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Two Input Boxes Side-by-Side */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                {/* Box A: Vocabulary */}
                                <div className="flex flex-col">
                                    <div className="flex items-baseline justify-between mb-1.5">
                                        <label htmlFor="box-a-input" className="font-heading text-lg text-[var(--navy)]">
                                            Box A: Vocabulary <span className="text-xs font-sans font-bold opacity-70">(one item per line, Target = English)</span>
                                        </label>
                                    </div>
                                    <textarea
                                        id="box-a-input"
                                        className="w-full p-3.5 textarea-chunky font-mono text-xs sm:text-sm resize-y min-h-[170px]"
                                        rows={8}
                                        value={boxAText}
                                        onChange={(e) => setBoxAText(e.target.value)}
                                        placeholder="el perro = the dog&#10;el gato = the cat"
                                    />
                                    <div className="mt-2 flex items-center justify-between flex-wrap gap-2 text-xs">
                                        <span className="font-bold text-[var(--teal)]" data-testid="box-a-report">
                                            {parsedBoxA.report}
                                        </span>
                                        <span className="text-[var(--navy)] opacity-70 font-medium">
                                            Use <b>=</b> or <b>Tab</b> between target word and English
                                        </span>
                                    </div>
                                </div>

                                {/* Box B: Sentences */}
                                <div className="flex flex-col">
                                    <div className="flex items-baseline justify-between mb-1.5">
                                        <label htmlFor="box-b-input" className="font-heading text-lg text-[var(--navy)]">
                                            Box B: Sentences <span className="text-xs font-sans font-bold opacity-70">(one per line, [gap] and *picture*)</span>
                                        </label>
                                    </div>
                                    <textarea
                                        id="box-b-input"
                                        className="w-full p-3.5 textarea-chunky font-mono text-xs sm:text-sm resize-y min-h-[170px]"
                                        rows={8}
                                        value={boxBText}
                                        onChange={(e) => setBoxBText(e.target.value)}
                                        placeholder="Mi hermano tiene un [perro]. = My brother has a dog.&#10;El *gato* duerme en el sofá. = The cat sleeps on the sofa."
                                    />
                                    <div className="mt-2 flex items-center justify-between flex-wrap gap-2 text-xs">
                                        <span className="font-bold text-[var(--teal)]" data-testid="box-b-report">
                                            {parsedBoxB.report}
                                            {parsedBoxB.bracketCount > 0 ? ` · ${parsedBoxB.bracketCount} [gap]` : ''}
                                            {parsedBoxB.picturePromptCount > 0 ? ` · ${parsedBoxB.picturePromptCount} *picture*` : ''}
                                        </span>
                                        <span className="text-[var(--navy)] opacity-70 font-medium">

                                    </div>
                                </div>
                            </div>

                                    <label className="inline-flex items-center gap-2 font-bold cursor-pointer">

                                            type="checkbox"
                                            checked={removeArticles}
                                            onChange={(e) => setRemoveArticles(e.target.checked)}
                                            className="w-4 h-4 accent-[var(--teal)]"
