                                    </label>
                                    <label className="inline-flex items-center gap-2 font-bold cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={removeAccents}
                                            onChange={(e) => setRemoveAccents(e.target.checked)}
                                            className="w-4 h-4 accent-[var(--teal)]"
                                        />
                                        <span>Remove accents in grids (ß always stays ß)</span>
                                    </label>
                                    <label className="inline-flex items-center gap-2 font-bold cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={showTargetRubric}
                                            onChange={(e) => setShowTargetRubric(e.target.checked)}
                                            className="w-4 h-4 accent-[var(--teal)]"
                                        />
                                        <span>Show target-language rubrics</span>
                                    </label>
                                </div>
                                {withPictures && loadingImages && (
                                    <span className="font-bold text-[var(--teal)]">Looking up pictures…</span>
                                )}
                            </div>
                        </section>

                        {/* =========================================================
                            SECTIONS 5, 6, 7, 8: WORKSHEET BUILDER (Left) + LIVE A4 PREVIEW (Right)
                           ========================================================= */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                            {/* --- LEFT COLUMN: WORKSHEET BUILDER (5 cols on lg) --- */}
                            <aside className="lg:col-span-5 kind-panel p-5 space-y-5">
                                <div className="flex items-center justify-between gap-2 pb-3 border-b-[2px] border-[var(--navy)]">
                                    <h2 className="heading-3 text-[var(--navy)]">Worksheet Builder</h2>
                                    <button
                                        type="button"
                                        onClick={handleQuickWorksheet}
                                        className="btn-chunky btn-mustard-chunky text-xs h-9 px-3"
                                        title="Adds Word search + Matching + Gap fill + Jumbled sentences (skipping any that can't run)"
                                    >
                                        ⚡ Quick worksheet
                                    </button>
                                </div>

                                {/* Header Settings: Title & Optional Class/Teacher Line */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <label className="block">
                                        <span className="text-xs font-bold text-[var(--navy)]">Worksheet Title</span>
                                        <input
                                            type="text"
                                            value={worksheetTitle}
                                            onChange={(e) => setWorksheetTitle(e.target.value)}
                                            placeholder="Worksheet title"
                                            className="mt-1 w-full textarea-chunky px-3 py-1.5 text-sm font-bold"
                                        />
                                    </label>
                                    <label className="block">
                                        <span className="text-xs font-bold text-[var(--navy)]">Class / Teacher line (optional)</span>
                                        <input
                                            type="text"
                                            value={classLine}
                                            onChange={(e) => setClassLine(e.target.value)}
                                            placeholder="e.g. Class 8B · Ms García"
                                            className="mt-1 w-full textarea-chunky px-3 py-1.5 text-sm font-medium"
                                        />
                                    </label>
                                </div>

                                {/* Active Tasks in Order (Drag & Drop + Up/Down + Settings) */}
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider text-[var(--navy)]">
                                            Active Sections ({selectedTasks.length}) — Drag to reorder
                                        </span>
                                        {selectedTasks.length > 0 && (
                                            <button
                                                type="button"
                                                onClick={() => setSelectedTasks([])}
                                                className="text-xs font-bold text-[var(--orange)] hover:underline cursor-pointer"
                                            >
                                                Uncheck all
                                            </button>
                                        )}
                                    </div>

                                    {selectedTasks.length === 0 ? (
                                        <div className="p-4 rounded-[10px] bg-[var(--cream)] border-[2px] border-dashed border-[var(--navy)] text-xs font-bold text-center text-[var(--navy)] opacity-75">
                                            No tasks selected yet. Tick tasks from the catalogue below or click &ldquo;Quick worksheet&rdquo;.
                                        </div>
                                    ) : (
                                        <ul className="space-y-2.5">
                                            {selectedTasks.map((taskId, idx) => {
                                                const meta = window.PictorioDeck.TASK_CATALOGUE.find(t => t.id === taskId);
                                                if (!meta) return null;
                                                const avail = window.PictorioDeck.getTaskAvailability(taskId, {
                                                    vocab: parsedBoxA.items,
                                                    sentences: parsedBoxB.items,
                                                    withPictures,
                                                });
                                                const tSet = taskSettings[taskId] || {};
                                                const langRub = window.PictorioDeck.I18N[lang]?.rubrics?.[taskId];

                                                return (
                                                    <li
                                                        key={taskId}
                                                        draggable
                                                        onDragStart={() => setDraggedTaskId(taskId)}
                                                        onDragOver={(e) => e.preventDefault()}
                                                        onDrop={() => handleDropTask(taskId)}
                                                        className={`p-3 rounded-[10px] border-[2px] border-[var(--navy)] transition-colors ${avail.available ? 'bg-[var(--cream)]' : 'bg-gray-100 opacity-65'}`}

                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="flex items-center gap-2 min-w-0">
                                                                <span className="cursor-grab select-none text-sm font-bold px-1.5 py-0.5 rounded bg-[var(--mustard)] border border-[var(--navy)]" title="Drag to reorder">
                                                                    ⠿ {idx + 1}
                                                                </span>
                                                                <div className="min-w-0">
                                                                    <div className="text-sm font-bold text-[var(--navy)] truncate">
                                                                        {meta.name}
                                                                        {langRub && showTargetRubric && (
                                                                            <span className="ml-1.5 text-xs font-medium opacity-75">({langRub.title})</span>
                                                                        )}
                                                                    </div>
                                                                    {!avail.available && (
                                                                        <span className="text-[11px] font-bold text-[var(--orange)] block">
                                                                            Skipped: {avail.reason}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center gap-1 shrink-0">
                                                                <button
                                                                    type="button"
                                                                    disabled={idx === 0}
                                                                    onClick={() => moveTask(idx, -1)}
                                                                    className="px-2 py-1 text-xs font-bold bg-[var(--paper)] border border-[var(--navy)] rounded disabled:opacity-40 cursor-pointer"
                                                                    title="Move up"
                                                                    aria-label={`Move ${meta.name} up`}
                                                                >
                                                                    ↑
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    disabled={idx === selectedTasks.length - 1}
                                                                    onClick={() => moveTask(idx, 1)}
                                                                    className="px-2 py-1 text-xs font-bold bg-[var(--paper)] border border-[var(--navy)] rounded disabled:opacity-40 cursor-pointer"
                                                                    title="Move down"
                                                                    aria-label={`Move ${meta.name} down`}
                                                                >
                                                                    ↓
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => toggleTask(taskId)}
                                                                    className="px-2 py-1 text-xs font-bold bg-[var(--paper)] text-[var(--orange)] border border-[var(--navy)] rounded cursor-pointer"
                                                                    title="Remove task"
                                                                    aria-label={`Remove ${meta.name}`}
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>

                                                        {/* Per-Task Small Settings Panel */}
                                                        {taskId === 'wordsearch' && (
                                                            <div className="mt-2.5 pt-2.5 border-t border-[var(--navy)]/20 flex flex-wrap items-center gap-3 text-xs">

                                                                    <span>Grid size (8–20):</span>

                                                                        type="number"
                                                                        min="8"
                                                                        max="20"
                                                                        value={tSet.gridSize || 12}

                                                                            const val = Math.max(8, Math.min(20, parseInt(e.target.value, 10) || 12));
                                                                            updateTaskSetting('wordsearch', 'gridSize', val);
                                                                        }}
                                                                        className="w-14 px-1.5 py-0.5 bg-[var(--paper)] border border-[var(--navy)] rounded font-mono font-bold"
                                                                    />
                                                                </label>
                                                                <label className="inline-flex items-center gap-1.5 font-bold">
                                                                    <span>Difficulty:</span>
                                                                    <select
                                                                        value={tSet.difficulty || 'easy'}
                                                                        onChange={(e) => updateTaskSetting('wordsearch', 'difficulty', e.target.value)}
                                                                        className="px-2 py-0.5 bg-[var(--paper)] border border-[var(--navy)] rounded font-bold"
                                                                    >
                                                                        <option value="easy">Easy (→ ↓)</option>
                                                                        <option value="medium">Medium (+ diagonals)</option>
                                                                        <option value="hard">Hard (+ backwards)</option>
                                                                    </select>
                                                                </label>
                                                            </div>
                                                        )}

                                                        {taskId === 'matching' && (
                                                            <div className="mt-2.5 pt-2.5 border-t border-[var(--navy)]/20 flex flex-wrap items-center gap-2 text-xs">
                                                                <span className="font-bold">Pairs:</span>
                                                                <select
                                                                    value={tSet.pairMode || 'auto'}
                                                                    onChange={(e) => updateTaskSetting('matching', 'pairMode', e.target.value)}
                                                                    className="px-2 py-0.5 bg-[var(--paper)] border border-[var(--navy)] rounded font-bold"
                                                                >
                                                                    <option value="auto">Auto ({withPictures ? 'Picture – Target word' : 'English – Target word'})</option>
                                                                    <option value="picture-target" disabled={!withPictures}>Picture – Target word</option>
                                                                    <option value="english-target">English – Target word</option>
                                                                    <option value="picture-english" disabled={!withPictures}>Picture – English</option>
                                                                </select>
                                                            </div>
                                                        )}

                                                        {taskId === 'label_picture' && (
                                                            <div className="mt-2.5 pt-2.5 border-t border-[var(--navy)]/20 flex flex-wrap items-center gap-2 text-xs">
                                                                <span className="font-bold">Labels:</span>
                                                                <select
                                                                    value={tSet.mode || 'blank'}
                                                                    onChange={(e) => updateTaskSetting('label_picture', 'mode', e.target.value)}
                                                                    className="px-2 py-0.5 bg-[var(--paper)] border border-[var(--navy)] rounded font-bold"
                                                                >
                                                                    <option value="blank">Blank writing line</option>
                                                                    <option value="scaffold">Scaffolded (p _ _ _ o)</option>
                                                                </select>
                                                            </div>
                                                        )}

                                                        {taskId === 'jumbled_sentences' && (
                                                            <div className="mt-2.5 pt-2.5 border-t border-[var(--navy)]/20 flex flex-wrap items-center gap-4 text-xs">
                                                                <label className="inline-flex items-center gap-1.5 font-bold cursor-pointer">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={tSet.lowercaseFirst !== false}
                                                                        onChange={(e) => updateTaskSetting('jumbled_sentences', 'lowercaseFirst', e.target.checked)}
                                                                        className="accent-[var(--teal)]"
                                                                    />
                                                                    <span>Lowercase the first word</span>
                                                                </label>
                                                                <label className="inline-flex items-center gap-1.5 font-bold cursor-pointer">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={!!tSet.showEnglish}
                                                                        onChange={(e) => updateTaskSetting('jumbled_sentences', 'showEnglish', e.target.checked)}
                                                                        className="accent-[var(--teal)]"
                                                                    />
                                                                    <span>Show English as support</span>
                                                                </label>
                                                            </div>
                                                        )}

                                                        {taskId === 'sentence_gapfill' && (
                                                            <div className="mt-2.5 pt-2.5 border-t border-[var(--navy)]/20 flex flex-wrap items-center gap-4 text-xs">
                                                                <label className="inline-flex items-center gap-1.5 font-bold cursor-pointer">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={tSet.wordBank !== false}
                                                                        onChange={(e) => updateTaskSetting('sentence_gapfill', 'wordBank', e.target.checked)}
                                                                        className="accent-[var(--teal)]"
                                                                    />
                                                                    <span>Word bank (shuffled)</span>
                                                                </label>
                                                                <label className="inline-flex items-center gap-1.5 font-bold cursor-pointer">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={!!tSet.showFirstLetter}
                                                                        onChange={(e) => updateTaskSetting('sentence_gapfill', 'showFirstLetter', e.target.checked)}
                                                                        className="accent-[var(--teal)]"
                                                                    />
                                                                    <span>Show first letter in gap</span>
                                                                </label>
                                                            </div>
                                                        )}
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    )}
                                </div>

                                {/* Task Catalogue Checklist: Group A (Word tasks) & Group B (Sentence tasks) */}
                                <div className="pt-3 border-t-[2px] border-[var(--navy)] space-y-4">

                                        ['A', 'A. Word tasks (from Box A)'],
                                        ['B', 'B. Sentence tasks (from Box B)']
                                    ].map(([grp, grpTitle]) => (
                                        <div key={grp}>
                                            <h3 className="text-xs font-bold uppercase tracking-wider text-[var(--navy)] mb-2">
                                                {grpTitle}
                                            </h3>
                                            <div className="grid grid-cols-1 gap-1.5">
                                                {window.PictorioDeck.TASK_CATALOGUE.filter(t => t.group === grp).map(t => {
                                                    const avail = window.PictorioDeck.getTaskAvailability(t.id, {
                                                        vocab: parsedBoxA.items,
                                                        sentences: parsedBoxB.items,
                                                        withPictures,
                                                    });
                                                    const checked = selectedTasks.includes(t.id);
                                                    return (
                                                        <label
                                                            key={t.id}
                                                            className={`flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-[8px] border border-[var(--navy)]/30 text-xs ${avail.available ? 'bg-[var(--paper)] hover:bg-[var(--cream)] cursor-pointer' : 'bg-gray-100 opacity-55 cursor-not-allowed'}`}
                                                        >
                                                            <div className="flex items-center gap-2 min-w-0">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={checked}
                                                                    disabled={!avail.available && !checked}
                                                                    onChange={() => toggleTask(t.id)}
                                                                    className="w-4 h-4 accent-[var(--teal)]"
                                                                />
                                                                <span className="font-bold text-[var(--navy)] truncate">
                                                                    {t.name}
                                                                </span>
                                                            </div>
                                                            {!avail.available && (
                                                                <span className="text-[11px] font-bold text-[var(--orange)] shrink-0">
                                                                    {avail.reason}
                                                                </span>
                                                            )}
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </aside>

                            {/* --- RIGHT COLUMN: LIVE A4 WORKSHEET PREVIEW & EXPORT BAR (7 cols on lg) --- */}
                            <section className="lg:col-span-7 kind-panel p-5 flex flex-col space-y-4">
                                {/* Top Preview Toolbar: Student / Answer Key Toggle + Export Buttons */}
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b-[2px] border-[var(--navy)]">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <span className="text-xs font-bold uppercase tracking-wider text-[var(--navy)]">Preview:</span>
                                        {[
                                            ['student', `Student (${worksheetDeck.studentPages.length})`],
                                            ['answer', `Answer key (${worksheetDeck.answerPages.length})`],
                                            ['both', 'Student + Key'],
                                            ['slides', `Slides (${slidesDeck.pages.length})`],
                                        ].map(([id, label]) => (
                                            <button
                                                key={id}
                                                type="button"
                                                onClick={() => setPreviewMode(id)}
                                                className={`grid-pill ${previewMode === id ? 'grid-pill-selected' : 'grid-pill-unselected'}`}
                                            >
                                                {label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Export Action Buttons (Section 8) */}
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <button
                                            type="button"
                                            onClick={handlePrintWorksheet}
                                            className="btn-chunky btn-primary-chunky text-xs h-10 px-3.5"
                                            title="Print or Save as PDF (Student pages followed by Answer Key pages)"
                                        >
                                            🖨️ Print / Save PDF
                                        </button>
                                        <button
                                            type="button"
                                            disabled={exportingFormat !== null}
                                            onClick={() => handleExportPptx('worksheet')}
                                            className="btn-chunky btn-secondary-chunky text-xs h-10 px-3"
                                            title="Download A4 Worksheet + Answer Key + Credits as PowerPoint (.pptx)"
                                        >
                                            {exportingFormat === 'worksheet' ? 'Building PPTX…' : '📄 Worksheet .pptx'}
                                        </button>
                                        <button
                                            type="button"
                                            disabled={exportingFormat !== null}
                                            onClick={() => handleExportPptx('slides')}
                                            className="btn-chunky btn-secondary-chunky text-xs h-10 px-3"
                                            title="Download Classroom Slides (One slide per task + Answer slides + Credits slide)"
                                        >
                                            {exportingFormat === 'slides' ? 'Building Slides…' : '🖥️ Slides .pptx'}
                                        </button>
                                    </div>
                                </div>

                                {/* Live A4 / Slides Canvas */}
                                <div className="bg-[var(--cream)] border-[2px] border-[var(--navy)] rounded-[10px] p-4 sm:p-6 overflow-y-auto max-h-[980px] flex flex-col items-center gap-6">
                                    {previewPages.map((page, i) => (
                                        <figure
                                            key={i}
                                            className="w-full m-0"
                                            style={{ maxWidth: previewMode === 'slides' ? 680 : 620 }}
                                        >
                                            <DeckPage page={page} cards={cards} pictureMap={pictureMap} />
                                            <figcaption className="text-xs font-bold text-[var(--navy)] opacity-75 mt-2 flex justify-between">
                                                <span>{i + 1}. {page.label}</span>
                                                <span>Version #{seed}</span>
                                            </figcaption>
                                        </figure>
                                    ))}
                                </div>
                            </section>
                        </div>

                        {/* =========================================================
                            PICTORIO FLASHCARD GRID & PICTURE PICKER SECTION
                           ========================================================= */}
                        <section className="kind-panel p-5">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b-[2px] border-[var(--navy)]">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <h2 className="heading-3 text-[var(--navy)]">
                                        Vocabulary Picture Cards ({cards.length})
                                    </h2>
                                    <span className="text-xs font-bold text-[var(--navy)] opacity-70">
                                        Click any card&rsquo;s search icon to pick a different picture — stored with that word so it never changes by itself.
                                    </span>
                                </div>
                                <div className="flex items-center gap-2 flex-wrap">
                                    <select
                                        value={labelMode}
                                        onChange={(e) => setLabelMode(e.target.value)}
                                        className="select-chunky text-xs h-9"
                                        aria-label="Card label mode"
                                    >
                                        <option value="full">Full labels</option>
                                        <option value="scaffold">Scaffolded (p***)</option>
                                        <option value="blank">Blank (Quiz)</option>
                                    </select>
                                    <label className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1.5 bg-[var(--cream)] border-[2px] border-[var(--navy)] rounded-[8px] cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={showEnglishOnCards}
                                            onChange={(e) => setShowEnglishOnCards(e.target.checked)}
                                            className="accent-[var(--teal)]"
                                        />
                                        <span>Show English</span>
                                    </label>
                                    <button
                                        type="button"
                                        onClick={() => setShowCardsSection(!showCardsSection)}
                                        className="grid-pill grid-pill-unselected text-xs"
                                    >
                                        {showCardsSection ? '▲ Hide cards' : '▼ Show cards'}
                                    </button>
                                </div>
                            </div>

                            {showCardsSection && (
                                <div className="mt-5">
                                    {!withPictures ? (
                                        <div className="p-6 rounded-[10px] bg-[var(--cream)] border-[2px] border-[var(--navy)] text-center">
                                            <p className="text-sm font-bold text-[var(--navy)]">
                                                Pictures are currently switched OFF. No picture searches run, and all worksheet clues use English.
                                            </p>
                                            <button
                                                type="button"
                                                onClick={() => setWithPictures(true)}
                                                className="mt-3 btn-chunky btn-mustard-chunky text-xs h-9"
                                            >
                                                Turn pictures ON
                                            </button>
                                        </div>
                                    ) : (
                                        <>
                                            {/* Grid size selector pills */}
                                            <div className="flex items-center justify-between flex-wrap gap-3 mb-5">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="overline-text text-[var(--navy)]">Grid columns:</span>
                                                    {GRID_SIZES.map((opt) => (
                                                        <button
                                                            key={opt.id}
                                                            type="button"
                                                            onClick={() => setGridConfig(opt)}
                                                            className={`grid-pill ${gridConfig.id === opt.id ? 'grid-pill-selected' : 'grid-pill-unselected'}`}
                                                        >
                                                            {opt.label}
                                                        </button>
                                                    ))}
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        clearVibewordCache();
                                                        setSuccessMessage('Image search cache cleared');
                                                        setTimeout(() => setSuccessMessage(''), 2500);
                                                    }}
                                                    className="text-xs font-bold text-[var(--orange)] hover:underline cursor-pointer"
                                                >
                                                    Clear image cache
                                                </button>
                                            </div>

                                            <div className={`grid gap-5 ${gridConfig.cols === 5 ? 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5' : gridConfig.cols === 4 ? 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-4' : 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3'}`}>
                                                {cards.map((card, index) => (
                                                    <div
                                                        key={card.wordKey + '-' + index}
                                                        className="kind-card p-4 flex flex-col items-center justify-between relative group min-h-[290px]"
                                                        style={{ transform: `rotate(${getCardRotation(index)}deg)` }}
                                                    >
                                                        {/* Source & Licence Top Bar */}
                                                        <div className="w-full flex justify-between items-center mb-2 px-1">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <span className="text-[11px] font-bold px-2 py-0.5 rounded-full border-[1.5px] border-[var(--navy)] bg-transparent text-[var(--navy)] inline-flex items-center gap-1">
                                                                    <span>{card.provider}</span>
                                                                </span>
                                                                {(card.provider === 'ARASAAC' || card.providerKey === 'arasaac') && (
                                                                    <span
                                                                        className="text-[10px] font-bold px-1.5 py-0.5 rounded-full border-[1.5px] border-[var(--navy)] bg-transparent text-[var(--navy)] cursor-help"
                                                                        title="Non-commercial classroom use only. Licence CC BY-NC-SA."
                                                                    >
                                                                        NC
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {card.license && (
                                                                <span className="text-[11px] font-medium text-[var(--navy)] opacity-70 truncate max-w-[115px]" title={card.license}>
                                                                    {card.license}
                                                                </span>
                                                            )}
                                                        </div>

                                                        {showEnglishOnCards && card.english && (
                                                            <div className="w-full text-center text-[var(--navy)] opacity-80 text-sm font-bold mb-1 px-1">
                                                                {card.english}
                                                            </div>
                                                        )}

                                                        {/* Picture Box (Clickable to open picture picker) */}
                                                        <div
                                                            onClick={() => runPickerSearch(card.wordKey, card.word, card.searchTerm)}
                                                            className="w-full h-36 flex items-center justify-center mb-2 overflow-hidden rounded-[10px] bg-[var(--cream)] border-[1.5px] border-[var(--navy)] relative p-2 cursor-pointer"
                                                            title="Click to pick a different picture"
                                                        >
                                                            {card.image ? (
                                                                <img
                                                                    src={card.image}
                                                                    alt={card.word}
                                                                    className="max-h-full max-w-full object-contain"
                                                                    loading="lazy"
                                                                />
                                                            ) : (
                                                                <div className="flex flex-col items-center justify-center text-center p-2 text-[var(--navy)] opacity-60">
                                                                    <span className="text-xs font-bold">No image yet</span>
                                                                    <span className="text-[10px] mt-0.5 font-medium">Click to search or upload</span>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {card.attribution && (
                                                            <div className="w-full text-center px-1 mb-1">
                                                                <div className="text-[10px] text-[var(--navy)] opacity-70 truncate font-medium" title={card.attribution}>
                                                                    {card.author ? `© ${card.author}` : card.attribution}
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Hover Action Buttons */}
                                                        <div className="absolute top-2 right-2 flex space-x-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button
                                                                type="button"
                                                                onClick={() => handleRefreshCardImage(card)}
                                                                aria-label="Try next image"
                                                                title="Try next image from providers"
                                                                className="icon-btn-chunky"
                                                            >
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => runPickerSearch(card.wordKey, card.word, card.searchTerm)}
                                                                aria-label="Choose a picture"
                                                                title="See pictures from every source and pick one"
                                                                className="icon-btn-chunky"
                                                            >
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                                            </button>
                                                            {card.history && card.history.length > 0 && (
                                                                <button
                                                                    type="button"
                                                                    onClick={() => undoPictureForKey(card.wordKey)}
                                                                    aria-label="Back to previous picture"
                                                                    title="Back to previous picture"
                                                                    className="icon-btn-chunky"
                                                                >
                                                                    ↩
                                                                </button>
                                                            )}
                                                            <label
                                                                aria-label="Upload custom image"
                                                                title="Upload image file"
                                                                className="icon-btn-chunky"
                                                            >
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                                                <input type="file" className="hidden" accept="image/*" onChange={(e) => handleUploadCardImage(card.wordKey, e)} />
                                                            </label>
                                                        </div>

                                                        {/* Target Word Label */}
                                                        <div className="w-full mt-1 text-center">
                                                            <div
                                                                className="w-full text-center font-heading text-[var(--navy)] text-lg sm:text-xl leading-snug break-words"
                                                                style={{ fontFamily: "'League Spartan', sans-serif", fontWeight: 800 }}
                                                            >
                                                                {getMaskedLabel(card.word, labelMode)}
                                                            </div>
                                                            <div className="h-[5px] w-12 bg-[var(--mustard)] border-[1.5px] border-[var(--navy)] rounded-full mx-auto mt-1"></div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* Extra Sentence *keyword* Pictures if any */}
                                            {extraKeywordCards.length > 0 && (
                                                <div className="mt-6 pt-4 border-t-[2px] border-[var(--navy)]">
                                                    <h3 className="text-sm font-bold text-[var(--navy)] mb-3">
                                                        Sentence *keyword* pictures (from Box B)
                                                    </h3>
                                                    <div className="flex flex-wrap gap-4">
                                                        {extraKeywordCards.map((kc) => (
                                                            <div key={kc.wordKey} className="bg-[var(--cream)] border-[2px] border-[var(--navy)] rounded-[10px] p-3 flex items-center gap-3">
                                                                {kc.image ? (
                                                                    <img src={kc.image} alt={kc.word} className="w-14 h-14 object-contain bg-white border border-[var(--navy)] rounded p-1" />
                                                                ) : (
                                                                    <div className="w-14 h-14 flex items-center justify-center bg-white border border-[var(--navy)] rounded text-[10px] font-bold">No pic</div>
                                                                )}
                                                                <div>
                                                                    <div className="font-bold text-sm text-[var(--navy)]">*{kc.word}*</div>
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => runPickerSearch(kc.wordKey, kc.word, kc.searchTerm)}
                                                                        className="text-xs font-bold text-[var(--teal)] hover:underline cursor-pointer mt-0.5"
                                                                    >
                                                                        Change picture
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                        </section>

                        {/* --- ATTRIBUTIONS & LICENCES ACCORDION --- */}
                        {cardsWithAttribution.length > 0 && (
                            <section className="kind-panel p-5 overflow-hidden">
                                <div
                                    onClick={() => setShowAttributionsPanel(!showAttributionsPanel)}
                                    className="flex items-center justify-between cursor-pointer"
                                >
                                    <div className="flex items-center space-x-2">
                                        <span className="font-heading font-extrabold text-[var(--navy)] text-base">Attributions &amp; licences</span>
                                        <span className="text-xs font-bold text-[var(--navy)] opacity-70">({cardsWithAttribution.length} items)</span>
                                    </div>
                                    <span className="text-[var(--navy)] text-sm font-bold">{showAttributionsPanel ? '▲ Hide' : '▼ Show'}</span>
                                </div>

                                {showAttributionsPanel && (
                                    <div className="pt-4 mt-4 border-t-[2px] border-[var(--navy)]">
                                        {cards.some(c => c.provider === 'ARASAAC' || c.providerKey === 'arasaac') && (
                                            <div className="mb-4 px-4 py-3 bg-[var(--cream)] text-[var(--navy)] border-[2px] border-[var(--navy)] rounded-[10px] text-xs font-medium">
                                                This set contains ARASAAC pictograms, licensed CC BY-NC-SA. Classroom use only, not for resale.
                                            </div>
                                        )}
                                        <div className="flex justify-end mb-3">
                                            <button
                                                type="button"
                                                onClick={handleCopyAttributions}
                                                className="btn-chunky btn-secondary-chunky px-4 text-xs h-10"
                                            >
                                                <span>{copiedAttributions ? '✓ Copied' : '📋 Copy attributions'}</span>
                                            </button>
                                        </div>
                                        <div className="bg-[var(--cream)] rounded-[10px] p-4 border-[2px] border-[var(--navy)] font-mono text-xs text-[var(--navy)] opacity-80 space-y-1.5 max-h-60 overflow-y-auto">
                                            {cardsWithAttribution.map((c, i) => (
                                                <div key={i}>
                                                    <span className="font-bold">{c.word}</span>
                                                    <span className="opacity-70"> — </span>
                                                    <span>{c.attribution || c.license || c.provider}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {/* =========================================================
                        PICTURE PICKER MODAL (Multi-source image chooser)
                       ========================================================= */}
                    {picker && (() => {
                        const existingPic = pictureMap[picker.wordKey] || {};
                        const total = picker.groups.reduce((n, g) => n + g.items.length, 0);
                        return (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-5 no-print" style={{ background: 'rgba(12,16,41,0.55)' }} onClick={() => setPicker(null)}>
                                <div role="dialog" aria-modal="true" aria-label="Choose a picture" className="kind-panel w-full max-w-5xl flex flex-col" style={{ maxHeight: '92vh' }} onClick={(e) => e.stopPropagation()}>
                                    <div className="px-5 py-4 border-b-[2px] border-[var(--navy)] flex flex-col gap-3">
                                        <div className="flex items-center justify-between gap-3 flex-wrap">
                                            <h2 className="font-heading font-extrabold text-[var(--navy)] text-xl">Pictures for “{picker.displayWord}”</h2>
                                            <div className="flex items-center gap-2 text-xs font-bold text-[var(--navy)]">
                                                <span className="opacity-70">Current:</span>
                                                {existingPic.image ? (
                                                    <img src={existingPic.image} alt="" className="w-12 h-12 object-contain bg-white border-[2px] border-[var(--navy)] rounded-[6px]" />
                                                ) : (
                                                    <span className="opacity-70">none</span>
                                                )}
                                            </div>
                                        </div>
                                        <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); runPickerSearch(picker.wordKey, picker.displayWord, e.target.elements.q.value); }}>
                                            <input
                                                name="q"
                                                key={picker.query}
                                                defaultValue={picker.query}
                                                aria-label="Search for pictures"
                                                className="flex-1 textarea-chunky px-3 py-2 text-sm font-medium"
                                                placeholder="Search in English, e.g. dog, cat, house"
                                            />
                                            <button type="submit" className="btn-chunky btn-primary-chunky">Search</button>
                                        </form>
                                    </div>

                                    <div className="flex-1 min-h-0 overflow-y-auto px-5 py-4 bg-[var(--cream)] space-y-5">
                                        {picker.loading && <p className="text-sm font-bold text-[var(--navy)]">Searching every source…</p>}
                                        {!picker.loading && total === 0 && <p className="text-sm font-bold text-[var(--navy)]">No pictures found. Try a shorter or different English word.</p>}
                                        {!picker.loading && picker.groups.filter(g => g.items.length).map(g => (
                                            <section key={g.name}>
                                                <h3 className="text-sm font-bold text-[var(--navy)]">{g.name} <span className="font-medium opacity-70">· {g.note}</span></h3>
                                                <div className="grid gap-3 mt-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(110px, 1fr))' }}>
                                                    {g.items.map((item, i) => {
                                                        const current = item.url === existingPic.image;
                                                        return (
                                                            <button
                                                                key={item.url + i}
                                                                type="button"
                                                                title={item.attribution}
                                                                onClick={() => {
                                                                    applyPictureToKey(picker.wordKey, item, { searchTerm: picker.query, imagePage: 1 });
                                                                    setPicker(null);
                                                                }}
                                                                className={`bg-white rounded-[10px] border-[2px] p-1.5 flex flex-col items-center gap-1 cursor-pointer hover:shadow-[3px_3px_0_var(--navy)] ${current ? 'border-[var(--teal)] ring-2 ring-[var(--teal)]' : 'border-[var(--navy)]'}`}
                                                            >
                                                                <img src={item.url} alt="" loading="lazy" className="w-full h-24 object-contain" />
                                                                <span className="text-[10px] font-medium text-[var(--navy)] opacity-70 truncate w-full text-center">
                                                                    {current ? 'Current picture' : (item.author || item.provider)}
                                                                </span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </section>
                                        ))}
                                    </div>

                                    <div className="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-t-[2px] border-[var(--navy)]">
                                        <button
                                            type="button"
                                            disabled={!existingPic.history || existingPic.history.length === 0}
                                            onClick={() => undoPictureForKey(picker.wordKey)}
                                            className="btn-chunky btn-secondary-chunky disabled:opacity-40"
                                        >
                                            ↩ Back to previous picture
                                        </button>
                                        <button type="button" onClick={() => setPicker(null)} className="btn-chunky btn-secondary-chunky">Close</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PictorioApp />);
    </script>
</body>
</html>
